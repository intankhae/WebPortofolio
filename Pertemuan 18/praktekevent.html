<!DOCTYPE html>
<html>
<head>
    <title>Contoh Event JavaScript</title>
</head>
<body>

    <button onclick="tampilkanPesan(event)">Klik Saya</button>

    <script>
        function tampilkanPesan(event) {
            alert("Tombol berhasil diklik!");
            console.log(event.type);
        }
    </script>

</body>
</html>
