
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar JavaScript</title>
</head>
<body>

    <h2>Belajar JavaScript</h2>

    <label>Masukkan Nama:</label>
    <input type="text" id="nama" placeholder="Masukkan nama">
    <button onclick="sapaNama()">Klik Saya</button>

    <p id="hasil"></p>

    <script>
        function sapaNama() {

            // Meminta pengguna memasukkan nama
            let nama = prompt("Masukkan nama Anda:");

            // Memeriksa apakah nama diisi
            if (nama !== null && nama.trim() !== "") {

                // Menampilkan nama pada input
                document.getElementById("nama").value = nama;

                // Menampilkan pesan alert
                alert("Halo, " + nama + "!");

                // Menampilkan nama di console
                console.log("Nama yang dimasukkan: " + nama);

                // Menampilkan hasil pada halaman web
                document.getElementById("hasil").innerHTML =
                    "Selamat belajar JavaScript, " + nama + "!";
            }
        }
    </script>

</body>
</html>
