
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Perhitungan Belanja</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>SIMULASI PERHITUNGAN BELANJA</h1>

        <label>Nama Pembeli:</label><br>
        <input type="text" id="nama" placeholder="Masukkan nama pembeli">

        <br>

        <label>Total Belanja (Rp):</label><br>
        <input type="number" id="belanja" placeholder="Masukkan total belanja">

        <br>

        <button onclick="hitungTotal()">Hitung Total</button>

        <h2>Hasil Perhitungan</h2>

        <div id="hasil">
            Hasil perhitungan akan ditampilkan di sini.
        </div>

    </div>

</body>
</html>
